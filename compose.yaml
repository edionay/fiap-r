x-ambiente-banco-dados: &ambiente-banco-dados
  DATABASE_URL: postgresql://veiculos:veiculos@postgres:5432/gestao_veiculos
  DB_MAX_CONNECTIONS: 10
  DB_IDLE_TIMEOUT_MS: 10000
  DB_CONNECTION_TIMEOUT_MS: 5000

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: gestao_veiculos
      POSTGRES_USER: veiculos
      POSTGRES_PASSWORD: veiculos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veiculos -d gestao_veiculos"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql

  migracao:
    image: api-gerenciamento-veiculos:local
    build:
      context: .
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *ambiente-banco-dados
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: api-gerenciamento-veiculos:local
    environment:
      <<: *ambiente-banco-dados
      PORT: 3000
    depends_on:
      migracao:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  dados_postgres:
